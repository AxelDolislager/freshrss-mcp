name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    services:
      freshrss:
        image: freshrss/freshrss:latest
        ports:
          - 8080:80
        env:
          FRESHRSS_INSTALL: |-
            --api-enabled
            --base-url http://localhost:8080
            --default-user admin
            --language en
            --title FreshRSS
            --db-type sqlite
          FRESHRSS_USER: |-
            --user admin
            --password adminpass123
            --api-password adminapipass123
            --no-default-feeds
            --language en

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Wait for FreshRSS
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/i/ >/dev/null; then
              echo "FreshRSS is up"
              exit 0
            fi
            sleep 2
          done
          echo "FreshRSS did not become ready in time"
          exit 1

      - name: Integration tests (against CI FreshRSS)
        env:
          FRESHRSS_URL: http://localhost:8080
          FRESHRSS_USERNAME: admin
          FRESHRSS_API_PASSWORD: adminapipass123
        run: npm run test:integration

      - name: Upload build artifact
        if: ${{ matrix.node-version == '20.x' }}
        uses: actions/upload-artifact@v4
        with:
          name: freshrss-mcp-dist
          path: |
            dist
            package.json
            README.md
            LICENSE
